name: "GRC Policy-as-Code Engine"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compliance-scan:
    name: "Enforce GRC Guardrails"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Policy Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: "."
          framework: "terraform"
          external_checks_dir: "./custom_policies"
          check: "CUSTOM_GRC_AWS_001,CUSTOM_GRC_AWS_002"
          soft_fail: false
          output_format: "cli"
