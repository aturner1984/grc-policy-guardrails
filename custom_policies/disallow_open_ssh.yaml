metadata:
  id: "CUSTOM_GRC_AWS_002"
  name: "Ensure Security Groups do not allow inbound SSH (Port 22) from 0.0.0.0/0"
  category: "networking"
  severity: "CRITICAL"

definition:
  cond_type: "not"
  operator: "and"
  rules:
    - cond_type: "attribute"
      resource_types:
        - "aws_security_group"
      attribute: "ingress[].cidr_blocks[]"
      operator: "contains"
      value: "0.0.0.0/0"
    - cond_type: "attribute"
      resource_types:
        - "aws_security_group"
      attribute: "ingress[].from_port"
      operator: "equals"
      value: 22
